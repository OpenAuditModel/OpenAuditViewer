name: Bug report
description: Something the viewer got wrong, or would not do
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach a real audit log. Files opened during normal use carry real names, addresses
        and resource identifiers, and an issue is public. If reproducing needs a file, construct a
        synthetic one — `npm run demo-logs` produces a dataset you can adapt.

        For a security issue, do not open an issue at all. See
        [SECURITY.md](https://github.com/OpenAuditModel/OpenAuditViewer/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Input
      description: >
        A synthetic event or file that reproduces it, if the problem depends on the data. Redacting
        a real event is not a substitute — remove the whole thing and build a minimal one.
      render: json

  - type: input
    id: version
    attributes:
      label: Version
      description: From Settings → About, or the commit you built.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: This issue contains no real audit data.
          required: true
