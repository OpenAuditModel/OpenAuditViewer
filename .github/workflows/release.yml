name: Release

# Tag-driven, and deliberately manual at the end: the workflow builds and
# attaches the binary, but leaves the release as a DRAFT. Someone has to read
# it and press publish, which is the last point at which an unsigned binary can
# be stopped from going out under the project's name.
#
# v0.1 ships a portable executable only. An installer buys a Start Menu entry
# and WebView2 bootstrapping; it costs an extra "unknown publisher" elevation
# prompt on top of the SmartScreen warning, and leaves something installed on a
# machine that a person may only have wanted to try once. For a tool that reads
# audit logs, run-and-delete is the better default. Installers can come back
# when there is a certificate to sign them with.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Portable build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The same checks CI runs, repeated here: a tag can be pushed from a
      # commit that never went through a pull request.
      - name: Fail if the generated validator is stale
        run: |
          npm run generate-validator
          git diff --exit-code -- src/schema/validate.generated.js

      - run: npm test

      # --no-bundle skips WiX and NSIS entirely, so the job neither downloads
      # nor produces installers.
      - name: Build the portable executable
        run: npm run tauri build -- --no-bundle

      - name: Name the artifact after the tag and checksum it
        id: artifact
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/openaudit-viewer.exe \
             "release/OpenAuditViewer-${GITHUB_REF_NAME}-x64-portable.exe"
          cd release
          sha256sum *.exe | tee SHA256SUMS.txt
          echo "sha256=$(cut -d' ' -f1 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"

      - name: Attach to a draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          body: |
            Experimental build. See CHANGELOG.md for what changed.

            A single portable executable: download, run, delete when done.
            Nothing is installed and no administrator rights are needed.

            **It is unsigned.** Windows SmartScreen will warn on first run
            ("More info" → "Run anyway"). Nothing is blocked; the warning
            reflects the absence of a code-signing certificate, not a problem
            with the file.

            SHA-256: `${{ steps.artifact.outputs.sha256 }}`

            A checksum published beside the file it describes proves only that
            the download was not corrupted in transit. It is not a substitute
            for a signature, and it is worth exactly as much as your trust in
            this page.

            Requires the WebView2 runtime, which is present on Windows 11 and
            installed alongside Edge on Windows 10. Without an installer to
            bootstrap it, a machine that lacks it needs it installed once from
            Microsoft.
