name: Release

# Tag-driven, and deliberately manual at the end: the workflow builds and
# attaches the binary, but leaves the release as a DRAFT. Someone has to read
# it and press publish, which is the last point at which an unsigned binary can
# be stopped from going out under the project's name.
#
# v0.1 ships a portable executable only. An installer buys a Start Menu entry
# and WebView2 bootstrapping; it costs an extra "unknown publisher" elevation
# prompt on top of the SmartScreen warning, and leaves something installed on a
# machine that a person may only have wanted to try once. For a tool that reads
# audit logs, run-and-delete is the better default. Installers can come back
# when there is a certificate to sign them with.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Portable build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Four files carry this application's version and a fifth dates it. A tag
      # that disagrees with them produces a release named for one version
      # containing another, and nothing downstream would notice.
      - name: Confirm the tag matches the version files
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            version=$(node -p "require('./$file').version")
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match $file version $version"
              exit 1
            fi
          done
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match src-tauri/Cargo.toml version $crate"
            exit 1
          fi
          if ! grep -qE "^## $tag - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated \"## $tag - YYYY-MM-DD\" section"
            exit 1
          fi

      # The same checks CI runs, repeated here: a tag can be pushed from a
      # commit that never went through a pull request.
      - name: Fail if the generated validator is stale
        run: |
          npm run generate-validator
          git diff --exit-code -- src/schema/validate.generated.js

      - run: npm test

      # --no-bundle skips WiX and NSIS entirely, so the job neither downloads
      # nor produces installers.
      - name: Build the portable executable
        run: npm run tauri build -- --no-bundle

      - name: Name the artifact after the tag and checksum it
        id: artifact
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/openaudit-viewer.exe \
             "release/OpenAuditViewer-${GITHUB_REF_NAME}-x64-portable.exe"
          cd release
          sha256sum *.exe | tee SHA256SUMS.txt
          echo "sha256=$(cut -d' ' -f1 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"

      # The release page says what changed, taken from the changelog's
      # section for this tag, rather than pointing somewhere else to find out.
      # A tag with no dated section fails here, not after publishing a page
      # with nothing on it.
      - name: Write the release notes from the changelog
        shell: bash
        env:
          WINDOWS_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version} - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release/notes.md
          if ! grep -q '[^[:space:]]' release/notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          cat >> release/notes.md <<EOF

          ## Downloads

          **Windows** — \`OpenAuditViewer-${GITHUB_REF_NAME}-x64-portable.exe\`, a single portable
          executable: download, run, delete when done. Nothing is installed and no administrator
          rights are needed. It is not code-signed, so SmartScreen warns on first run ("More info" →
          "Run anyway"); the warning reflects the absence of a signing certificate, not a problem
          with the file. It needs the WebView2 runtime, which is present on Windows 11 and installed
          alongside Edge on Windows 10.

          **macOS** — a universal disk image, signed with a Developer ID certificate and notarized by
          Apple, so it opens without a Gatekeeper prompt. Drag it out, run it, delete it.

          Windows executable SHA-256: \`${WINDOWS_SHA256}\`. The macOS checksum is in
          \`SHA256SUMS-macos.txt\`. A checksum published beside the file it describes proves only
          that the download was not corrupted in transit. It is not a signature, and it is worth
          exactly as much as your trust in this page.
          EOF

      - name: Attach to a draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          body_path: release/notes.md

  macos:
    name: Signed universal build (macOS)
    runs-on: macos-latest
    # Serialized behind the Windows job rather than run beside it: both attach
    # to the same draft release, and two jobs creating it at the same moment is
    # a race whose loser fails a release for no reason. The wait costs minutes;
    # the race costs a re-run.
    needs: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The same checks CI runs, repeated here for the same reason as above.
      - name: Fail if the generated validator is stale
        run: |
          npm run generate-validator
          git diff --exit-code -- src/schema/validate.generated.js

      - run: npm test

      # The certificate is imported into a keychain created for this run and
      # deleted at the end of it. `set-key-partition-list` is what lets codesign
      # use the key without a GUI prompt nobody is there to answer.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain_password=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" build.keychain > /dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning build.keychain

      # notarytool reads the App Store Connect key from a file, so the secret is
      # written to one inside the runner's temporary directory and removed below.
      - name: Write the notarization key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          chmod 600 "$RUNNER_TEMP/api-key.p8"

      # One disk image for both architectures: the download page stays a single
      # line, which is the whole distribution story on the Windows side too.
      # Tauri signs during bundling, submits to Apple and staples the ticket, so
      # the artifact that leaves this job is one Gatekeeper accepts offline.
      - name: Build, sign and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/api-key.p8
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Name the artifact after the tag and checksum it
        run: |
          mkdir -p release
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg \
            -name "*.dmg" -print -quit)
          if [ -z "$dmg" ]; then
            echo "::error::no disk image was produced"
            exit 1
          fi
          cp "$dmg" "release/OpenAuditViewer-${GITHUB_REF_NAME}-universal.dmg"
          cd release
          shasum -a 256 *.dmg | tee -a SHA256SUMS-macos.txt

      # Proof rather than assumption: an unnotarized or badly stapled image
      # passes every step above and fails on the first machine that opens it.
      - name: Confirm Gatekeeper accepts it
        run: |
          hdiutil attach "release/OpenAuditViewer-${GITHUB_REF_NAME}-universal.dmg" \
            -mountpoint /Volumes/OpenAuditViewer -nobrowse -quiet
          spctl --assess --type execute --verbose=4 /Volumes/OpenAuditViewer/*.app
          codesign --verify --deep --strict --verbose=2 /Volumes/OpenAuditViewer/*.app
          xcrun stapler validate /Volumes/OpenAuditViewer/*.app
          hdiutil detach /Volumes/OpenAuditViewer -quiet

      - name: Remove the signing material from the runner
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/api-key.p8"
          security delete-keychain build.keychain || true

      - name: Attach to the draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          name: ${{ github.ref_name }}
          files: |
            release/*.dmg
            release/SHA256SUMS-macos.txt
