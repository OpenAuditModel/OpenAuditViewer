name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Type-check, test, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regenerating first proves the committed validator matches the vendored
      # schema: if it does not, the diff check below fails rather than the app
      # silently validating against a stale copy.
      - name: Generate validator
        run: npm run generate-validator

      - name: Fail if the generated validator is stale
        run: git diff --exit-code -- src/schema/

      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check

      - name: Build frontend
        run: npx vite build

      # The app ships a Content-Security-Policy without 'unsafe-eval'. Runtime
      # code generation in the bundle would blank the window on launch, which
      # no unit test would catch.
      - name: Fail if the bundle contains runtime code generation
        run: |
          if grep -rE "new Function\(|[^a-zA-Z]eval\(" dist/assets/*.js; then
            echo "::error::bundle contains runtime code generation, which the CSP forbids"
            exit 1
          fi

  # The Kafka source against a real broker: PLAINTEXT, and SASL over TLS with
  # PLAIN and both SCRAM mechanisms, with certificates made for the run. It
  # runs on Linux and builds no desktop application: it needs Docker for the
  # broker, which the Windows and macOS runners do not offer, and it tests
  # what a read does on the wire, which no platform changes.
  kafka:
    name: Kafka source against a broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Start the broker
        # bash, not the default `bash -e`: with pipefail, a broker that fails
        # to start fails this step rather than the tests two steps later.
        shell: bash
        run: src-tauri/kafka-source/tests/broker/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Test the Kafka source
        run: cargo test --manifest-path src-tauri/Cargo.toml -p oav-kafka --locked

      # Every broker test returns early when its environment is missing, so
      # that a laptop without Docker stays green. Here that would be a pass
      # that tested nothing; the environment is checked instead of trusted.
      - name: Confirm the broker tests ran
        run: |
          test -n "$OAV_KAFKA_PLAINTEXT" && test -n "$OAV_KAFKA_SASL_TLS" && test -f "$OAV_KAFKA_CA"

      - name: Stop the broker
        if: always()
        run: src-tauri/kafka-source/tests/broker/stop.sh

  desktop:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The two platforms the project publishes for, and only those. Linux is
        # not a target — not built, not tested, not published — by decision
        # rather than by neglect; it is added if it is ever asked for. A job that
        # compiled it here proved nothing anyone was going to ship.
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The release is one universal macOS image, so the Intel slice has
          # to build on this arm64 runner too; see the step below.
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the desktop application
        run: npm run tauri build

      # librdkafka and OpenSSL are C, built from source for each target. The
      # release builds an x86_64 slice on an arm64 machine, and a native library
      # built for the wrong architecture only fails when the slices are linked
      # — at release time, unless it is built here first.
      - name: Build the Kafka source for Intel Macs
        if: matrix.os == 'macos-latest'
        # Linked, not only compiled: a library built for the wrong
        # architecture fails at the link, and a bare build links nothing.
        run: cargo test --no-run --manifest-path src-tauri/Cargo.toml -p oav-kafka --target x86_64-apple-darwin --locked

      # After the build, because `generate_context!` compiles the built
      # frontend into the crate. Signature verification runs here in Rust, and
      # its vectors are the CLI's own answers; they have to hold on both
      # platforms the app ships for, not only the one it was written on.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # Windows only, deliberately. Both jobs exist to prove the code still
      # compiles; what is published comes from release.yml, signed where it
      # can be, and a macOS bundle built here without the signing material is
      # not something anyone should download. The portable executable is kept
      # because it is small and occasionally useful for a quick manual check;
      # it lives outside `bundle/` because it is the compiled binary, not a
      # packaged artifact.
      - name: Upload build output
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: openaudit-viewer-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/openaudit-viewer.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
