[package]
name = "openaudit-viewer"
version = "1.0.0"
description = "Local desktop viewer for OpenAuditModel-conformant audit logs"
authors = ["OpenAuditModel"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["kafka-source"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
# Signature verification against a key the user chose (src/signature.rs).
# Verification only: no private key is ever read, so the RSA crate's timing
# advisory on private-key operations (RUSTSEC-2023-0071) does not reach this.
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
# `hazmat` for the raw public-key operation that reads a PSS signature's salt
# length before the crate verifies it; see verify_pss_any_salt.
rsa = { version = "0.9", features = ["hazmat"] }
sha2 = "0.10"
spki = { version = "0.7", features = ["alloc"] }
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
# Reading a window of a Kafka topic (src/kafka.rs); the crate holds everything
# that talks to a broker, and is tested against a real one.
oav-kafka = { path = "kafka-source" }
# A source's password lives in the system keychain — macOS Keychain, Windows
# Credential Manager — and never in a file or in the webview.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

